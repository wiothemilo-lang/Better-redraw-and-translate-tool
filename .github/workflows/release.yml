name: Release Desktop Installers
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave empty to use v<package.json version>."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${PKG_VER}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Release tag=${TAG} version=${VER}"

  build-linux:
    name: Build Linux (.deb, .rpm, .tar.gz)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the commit the release tag points at, not whatever the dispatch ran on.
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Linux OCR, desktop, and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn-vert xvfb libasound2t64 rpm dpkg-dev
      - run: npm ci
      - run: npm run desktop:native -- linux-x64
      - run: npm test
      - run: npm run desktop:package -- linux-x64
      - name: Smoke test packaged Linux app
        run: xvfb-run -a npm run test:desktop -- --packaged
      - name: Build .deb (Debian/Ubuntu), .rpm (Fedora), and .tar.gz
        run: node scripts/package-release.mjs linux-x64 "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: release-dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows 10/11 (.exe Setup & Portable .zip)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the commit the release tag points at, not whatever the dispatch ran on.
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Windows OCR and Inno Setup
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - run: npm ci
      - run: npm run desktop:native -- win-x64
      - run: npm test
      - run: npm run desktop:package -- win-x64
      - name: Smoke test packaged Windows app
        run: npm run test:desktop -- --packaged
      - name: Build Windows Setup (.exe) and Portable (.zip)
        run: node scripts/package-release.mjs win-x64 "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: release-dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }} (.app, .dmg, .zip)
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the commit the release tag points at, not whatever the dispatch ran on.
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install macOS OCR
        run: brew install tesseract tesseract-lang
      - run: npm ci
      - run: npm run desktop:native -- osx-${{ matrix.arch }}
      - run: npm test
      - run: npm run desktop:package -- osx-${{ matrix.arch }}
      - name: Smoke test packaged macOS app
        run: npm run test:desktop -- --packaged
      - name: Build .app, .dmg, and .zip
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_NOTARIZE: ${{ secrets.MACOS_CODESIGN_IDENTITY != '' && '1' || '0' }}
        run: node scripts/package-release.mjs osx-${{ matrix.arch }} "${{ needs.meta.outputs.version }}"
      - name: Verify macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          DMG="release-dist/Khung-Thoai-${VER}-mac-${{ matrix.arch }}.dmg"
          ZIP="release-dist/Khung-Thoai-${VER}-mac-${{ matrix.arch }}.zip"
          APP="desktop-dist/Khung-Thoai-darwin-${{ matrix.arch }}/Khung-Thoai.app"
          ls -l release-dist
          test -s "$DMG"
          test -s "$ZIP"
          hdiutil imageinfo "$DMG" > /dev/null
          unzip -l "$ZIP" | grep -q "Khung-Thoai.app/Contents/Info.plist"
          test -f "$APP/Contents/Resources/native-worker/KhungThoai.Redraw"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist" | grep -qx "com.khungthoai.editor"
          if [ -n "${{ secrets.MACOS_CODESIGN_IDENTITY }}" ]; then
            codesign --verify --deep --strict "$APP"
            codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "flags=0x10000(runtime)"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-dist/*
          if-no-files-found: error

  verify-linux-repro:
    name: Verify reproducible Linux build
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the commit the release tag points at, not whatever the dispatch ran on.
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev
      - run: npm ci
      - name: Build the app and packages twice, then compare SHA-256 digests
        run: node scripts/verify-release-repro.mjs linux-x64 "${{ needs.meta.outputs.version }}" --app
      - uses: actions/upload-artifact@v7
        with:
          name: release-verify-linux-x64
          path: release-verify/reproducibility-report.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [meta, build-linux, build-windows, build-macos, verify-linux-repro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          # An RPM filename splits a prerelease version into version and release (1.2.0-beta.1 becomes
          # khung-thoai-1.2.0-0.1.beta.1.x86_64.rpm), so the name in the notes is read from the
          # artifacts themselves instead of being spelled out from the tag.
          # The `|| true` matters: under `set -eo pipefail` a failing `ls` would abort this step
          # before the guard below could say what was missing.
          # Only the basename reaches the notes: a path-prefixed name is not an asset in the release and
          # the check below (and every download link) would silently miss it.
          RPM_FILE=$(basename "$(ls release-assets/*.rpm 2>/dev/null | head -n 1 || true)")
          if [ -z "$RPM_FILE" ]; then
            echo "No .rpm artifact was uploaded; refusing to write release notes that point at nothing."
            exit 1
          fi

          cat << EOF > release-notes.md
          # Nixio (Khung Thoại) ${TAG}

          Bản phát hành chính thức **Nixio (Khung Thoại) ${TAG}** — ứng dụng biên tập, xóa chữ (redraw), OCR, dịch thuật và dàn thoại truyện tranh/manga với lõi xử lý ảnh **C#/.NET 10** tự chứa, hỗ trợ **Windows 10/11**, **macOS 12+ (Apple Silicon & Intel)**, **Ubuntu / Debian-based Linux** và **Fedora Linux**.

          ## Tải về theo hệ điều hành

          | Hệ điều hành | Gói cài đặt | Cách cài đặt nhanh |
          |---|---|---|
          | **Windows 10 / 11 (x64)** | \`Khung-Thoai-${VER}-win-x64-setup.exe\` | Chạy trình cài đặt (không cần quyền Admin, tự liên kết tệp \`.khungthoai\`) |
          | **Windows 10 / 11 (Portable)** | \`Khung-Thoai-${VER}-win-x64-portable.zip\` | Giải nén và chạy \`Khung-Thoai.exe\` |
          | **macOS (Apple Silicon, arm64)** | \`Khung-Thoai-${VER}-mac-arm64.dmg\` | Mở tệp \`.dmg\` và kéo **Khung Thoại** vào \`Applications\` |
          | **macOS (Intel, x64)** | \`Khung-Thoai-${VER}-mac-x64.dmg\` | Mở tệp \`.dmg\` và kéo **Khung Thoại** vào \`Applications\` |
          | **macOS (Portable)** | \`Khung-Thoai-${VER}-mac-arm64.zip\` / \`Khung-Thoai-${VER}-mac-x64.zip\` | Giải nén và mở \`Khung-Thoai.app\` |
          | **Ubuntu / Debian / Mint / Pop!_OS (x64)** | \`khung-thoai_${VER}_amd64.deb\` | \`sudo apt install ./khung-thoai_${VER}_amd64.deb\` |
          | **Fedora Linux (x64)** | \`${RPM_FILE}\` | \`sudo dnf install ./${RPM_FILE}\` |
          | **Linux khác (Portable x64)** | \`khung-thoai-${VER}-linux-x64.tar.gz\` | Giải nén và chạy \`./Khung-Thoai\` |

          ## Bật OCR cục bộ (tùy chọn)
          Ứng dụng tích hợp sẵn lõi redraw/inpaint C#/.NET 10. Để dùng thêm **OCR offline**:
          - **Ubuntu / Debian**: \`sudo apt install tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn tesseract-ocr-jpn-vert\`
          - **Fedora**: \`sudo dnf install tesseract tesseract-langpack-eng tesseract-langpack-jpn tesseract-langpack-jpn_vert\`
          - **Windows 10/11**: Cài [UB-Mannheim Tesseract](https://github.com/UB-Mannheim/tesseract/wiki) hoặc \`winget install UB-Mannheim.TesseractOCR\`

          ## Điểm nổi bật trong ${TAG}
          - **Giao diện Pro Workstation (Figma / Clip Studio style)**:
            - Tân trang toàn bộ Light Mode (xám lạnh / trắng tinh khiết) và Dark Mode (matte graphite) với điểm nhấn emerald mảnh, bố cục 3 cột cố định tối ưu diện tích bàn vẽ lưới chấm và thanh tiêu đề 48px siêu gọn.
            - **Thanh công cụ dọc 44px (Tool Rail)** bám cạnh trái bàn vẽ với 11 icon SVG nét mảnh đồng bộ 2 chiều, ẩn/hiện cỡ cọ theo ngữ cảnh và nhóm thuộc tính Inspector thu gọn dạng Accordion.
          - **Trợ lý AI Vision & Glossary/QA Linter 0-token**:
            - **AI Vision (\`inspect_page_image\`)**: Trợ lý AI Agent có thể soi trực tiếp vùng ảnh trang truyện đa phương thức (Gemini \`inlineData\` & OpenAI \`image_url\`) để đối chiếu biểu cảm, SFX, ngữ cảnh tranh và tự tỉa ảnh cũ tiết kiệm token.
            - **Glossary & QA Linter 0-token (\`lint_chapter_qa\`)**: Rà tức thì chữ chưa dịch, lệch từ điển thuật ngữ, placeholder còn sót và lỗi dấu câu (kèm \`autoFixPunctuation\`), tích hợp thẳng vào Export Preflight và 21 công cụ Agent.
          - **Webtoon & Redraw Pro (C#/.NET 10)**:
            - **Ghép & Cắt Webtoon**: Hộp thoại chuyên biệt ghép dọc dải trang thành dải Webtoon dài và cắt thông minh dọc khoảng trống (smart gutter slicing) không làm đứt khung tranh.
            - **C# Auto Content-Aware Cleanup (\`content_aware_cleanup\`)**: Chọn trực tiếp chế độ lấp nền thông minh PatchMatch C# ngay trên từng khung thoại.
            - **Xem trước Xử lý Raw 60fps**: Hộp thoại kéo ngưỡng làm sạch raw trực quan theo thời gian thực trước khi áp dụng cho trang hoặc cả chương.
          - **Hạ tầng CI/CD Node 24**: Nâng cấp toàn bộ GitHub Actions lên các bản major hỗ trợ Node 24 (\`checkout@v7\`, \`setup-node@v7\`, \`setup-dotnet@v6\`, \`upload-artifact@v7\`, \`download-artifact@v8\`).
          - **Bản macOS chính thức (.app/.dmg)**: Ma trận \`macos-15\` (arm64) và \`macos-15-intel\` (x64) đóng gói \`.app\` + \`.dmg\` + \`.zip\`, ký Hardened Runtime bằng \`CODESIGN_IDENTITY\` và notarise bằng \`xcrun notarytool\` khi có \`APPLE_ID\`, \`APPLE_APP_SPECIFIC_PASSWORD\`, \`APPLE_TEAM_ID\`.

          Kiểm tra toàn vẹn tệp bằng \`SHA256SUMS.txt\`.
          EOF

          # Every file the notes advertise has to be in the release, or a download link is dead and
          # nobody finds out until a user clicks it.
          node scripts/check-release-notes.mjs release-notes.md release-assets

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nixio (Khung Thoại) ${TAG}" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Nixio (Khung Thoại) ${TAG}" \
              --notes-file release-notes.md
          fi
