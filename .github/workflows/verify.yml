name: Verify desktop and image quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Linux OCR and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn-vert xvfb libasound2t64
      - name: Install Windows OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run desktop:native
      - run: npm test
      - name: Verify OCR dependencies
        shell: bash
        run: tesseract --list-langs | tee ocr-languages.txt && grep -q '^eng' ocr-languages.txt
      - run: npm run benchmark -- --output artifacts/benchmark.json
      - run: npm run desktop:package
      - name: Exercise packaged desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop -- --packaged
      - name: Exercise packaged desktop on Windows
        if: runner.os == 'Windows'
        run: npm run test:desktop -- --packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: artifacts/
