name: Verify desktop and image quality
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Linux OCR and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn-vert xvfb libasound2t64
      - name: Install Windows OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install macOS OCR
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang
      - run: npm ci
      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: npm run desktop:native
      - name: Run tests with coverage
        env:
          REQUIRE_NATIVE: "1"
        run: npm run test:coverage -- --test-concurrency=1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}
          path: artifacts/coverage/
          if-no-files-found: warn
      - name: Verify OCR dependencies
        shell: bash
        run: tesseract --list-langs | tee ocr-languages.txt && grep -q '^eng' ocr-languages.txt
      - run: npm run benchmark -- --output artifacts/benchmark.json
      - name: Compare visual baselines
        if: runner.os == 'Linux'
        run: npm run test:visual
      - name: Exercise browser autosave storage across tabs
        if: runner.os == 'Linux'
        run: npm run test:autosave
      - name: Evaluate agent output against golden fixtures
        run: npm run eval:agent -- --output artifacts/agent-eval.json
      - name: Upload agent evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-eval-${{ runner.os }}
          path: artifacts/agent-eval.json
          if-no-files-found: warn
      - run: npm run desktop:package
      - name: Exercise packaged desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop -- --packaged
      - name: Exercise packaged desktop on Windows
        if: runner.os == 'Windows'
        run: npm run test:desktop -- --packaged
      - name: Verify packaged macOS bundle layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="desktop-dist/Nixio-darwin-$(node -p 'process.arch')/Nixio.app"
          test -f "$APP/Contents/Resources/native-worker/KhungThoai.Redraw"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist" | grep -qx "com.nixio.editor"
      - name: Exercise packaged desktop on macOS
        if: runner.os == 'macOS'
        run: npm run test:desktop -- --packaged
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-${{ runner.os }}
          path: artifacts/visual/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: artifacts/
