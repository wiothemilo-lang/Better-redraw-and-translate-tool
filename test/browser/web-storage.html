<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Nixio · web-storage harness</title>
</head>
<body>
  <p>Harness cho trình duyệt thật: hai tab cùng origin dùng chung IndexedDB.</p>
  <script type="module">
    import * as storage from "/src/web-storage.js"

    const magic = new TextEncoder().encode("KHUNGTHOAI\n")
    const dbName = "khung-thoai-autosave"

    function projectBlob(projectId, pageCount, payload) {
      const manifest = new TextEncoder().encode(JSON.stringify({
        version: 2,
        ...(projectId ? { projectId } : {}),
        pages: Array.from({ length: pageCount }, (_, index) => ({ name: `p${index + 1}.png` })),
      }))
      const header = new Uint8Array(magic.length + 4)
      header.set(magic)
      new DataView(header.buffer).setUint32(magic.length, manifest.length, true)
      return new Blob([header, manifest, payload], { type: "application/octet-stream" })
    }

    function openRaw(version) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, version)
        request.onupgradeneeded = () => {
          const db = request.result
          if (!db.objectStoreNames.contains("snapshots")) db.createObjectStore("snapshots")
          if (!db.objectStoreNames.contains("fonts")) db.createObjectStore("fonts")
        }
        request.onsuccess = () => resolve(request.result)
        request.onerror = () => reject(request.error)
      })
    }

    window.harness = {
      async save({ projectId, pageCount = 1, revision = 1, name, payload = "x" }) {
        return storage.saveWebSnapshot(projectBlob(projectId, pageCount, payload), {
          projectId,
          name: name ?? `${projectId.slice(0, 4)}.khungthoai`,
          pageCount,
          revision,
        })
      },
      list: () => storage.listWebSnapshots(),
      async loadText(id) {
        const file = await storage.loadWebSnapshot(id)
        if (!file) return null
        return {
          name: file.name,
          projectId: file.projectId ?? null,
          recovery: file.recovery === true,
          body: await file.text(),
        }
      },
      clear: (id) => storage.clearWebSnapshot(id),
      state: () => storage.webStorageState(),
      async saveFont(family, bytes) {
        return storage.saveCustomFont(family, new Uint8Array(bytes).buffer)
      },
      async listFonts() {
        return (await storage.listCustomFonts()).map(({ family, buffer }) => ({ family, size: buffer.byteLength }))
      },
      async seedLegacy({ projectId, pageCount = 2, savedAt = 1700000000000, name = "phien-cu.khungthoai", fontFamily = "Font Cũ" }) {
        const db = await openRaw(2)
        const blob = projectBlob(projectId, pageCount, "legacy")
        await new Promise((resolve, reject) => {
          const tx = db.transaction("snapshots", "readwrite")
          tx.objectStore("snapshots").put({ blob, name, pageCount, savedAt, size: blob.size }, "latest")
          tx.oncomplete = () => resolve()
          tx.onerror = () => reject(tx.error)
        })
        await new Promise((resolve, reject) => {
          const tx = db.transaction("fonts", "readwrite")
          tx.objectStore("fonts").put(
            { family: fontFamily, buffer: new Uint8Array([1, 2, 3, 4]).buffer, savedAt },
            fontFamily,
          )
          tx.oncomplete = () => resolve()
          tx.onerror = () => reject(tx.error)
        })
        db.close()
        return { size: blob.size }
      },
      async hasLegacyKey() {
        const db = await openRaw(2)
        const present = await new Promise((resolve, reject) => {
          const tx = db.transaction("snapshots", "readonly")
          const request = tx.objectStore("snapshots").getKey("latest")
          request.onsuccess = () => resolve(request.result !== undefined)
          request.onerror = () => reject(request.error)
        })
        db.close()
        return present
      },
      // Mimics a tab left open by an older build, which blocks the upgrade.
      async holdOldConnection() {
        const db = await openRaw(1)
        window.__oldConnection = db
        return db.version
      },
      closeOldConnection() {
        window.__oldConnection?.close()
        window.__oldConnection = null
      },
    }
    window.harnessReady = true
  </script>
</body>
</html>
